name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check Docker (required by Testcontainers e2e)
        run: docker info
      - name: Build and test
        env:
          GAME_E2E_REQUIRED: "true"
        run: ./mvnw -B -ntp verify
      - name: Upload coverage to Codecov
        if: hashFiles('**/target/site/jacoco/jacoco.xml') != ''
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: game-app/target/site/jacoco/jacoco.xml,game-network/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t game-server:ci .
