server:
  port: 8080

spring:
  application:
    name: game-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:game}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:game}
    password: ${MYSQL_PASSWORD:game}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

game:
  netty:
    enabled: true
    tcp-port: ${GAME_TCP_PORT:9000}
    websocket-port: ${GAME_WS_PORT:9001}
    websocket-path: /ws
    reader-idle-seconds: 90
  security:
    jwt-secret: ${JWT_SECRET:change-me-to-a-very-long-secret-key-32bytes!}
    jwt-expire-seconds: 86400
    ops-token: ${OPS_TOKEN:dev-ops-token}

logging:
  level:
    root: INFO
    com.cheng.game: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
